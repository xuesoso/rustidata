[workspace]
resolver = "2"
members = ["crates/core", "crates/loaders", "crates/tui"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/xuesoso/rustidata"

[workspace.dependencies]
rustidata-core = { path = "crates/core" }
rustidata-loaders = { path = "crates/loaders", default-features = false }

anyhow = "1"
compact_str = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.10"
regex = "1"
lru = "0.16"
roaring = "0.10"
memchr = "2"
memmap2 = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rhai = { version = "1", features = ["sync"] }

# compression
flate2 = "1"
bzip2 = "0.4"
liblzma = "0.3"
zstd = "0.13"

# loaders
csv = "1.3"
serde_json = "1"
arrow = "53"
parquet = "53"
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = { version = "0.26", features = ["dates"] }
arboard = "3"

# dev
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
