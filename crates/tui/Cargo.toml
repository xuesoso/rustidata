[package]
name = "rustidata"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rustidata"
path = "src/main.rs"

[features]
default = ["parquet", "sqlite", "xlsx", "system-clipboard"]
parquet = ["rustidata-loaders/parquet"]
sqlite = ["rustidata-loaders/sqlite"]
xlsx = ["rustidata-loaders/xlsx"]
system-clipboard = ["dep:arboard"]

[dependencies]
rustidata-core.workspace = true
rustidata-loaders = { workspace = true, default-features = false }
anyhow.workspace = true
compact_str.workspace = true
crossbeam-channel.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true
clap.workspace = true
crossterm.workspace = true
regex.workspace = true

arboard = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
